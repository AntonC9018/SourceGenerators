name: .NET

# Validate both pushed commits and pull request merge commits, including owner PRs.
on: [push, pull_request]

jobs:
  # Pack all projects with dotnet/MSBuild to generate NuGet packages.
  # This workflow also uploads the resulting packages as artifacts.
  build-packages:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x
    - name: Build Utils.Shared
      run: dotnet pack source/Utils.Shared/Utils.Shared.csproj -c Release
    - name: Build SourceGeneration
      run: dotnet pack source/SourceGeneration/SourceGeneration.csproj -c Release
    - name: Build SourceGeneration Roslyn testing helper
      run: dotnet pack source/SourceGeneration.RoslynTesting/SourceGeneration.RoslynTesting.csproj -c Release
    - name: Build SourceGeneration SDK
      run: dotnet pack source/SourceGeneration.Sdk/SourceGeneration.Sdk.csproj -c Release
    - name: Build SourceGeneration package testing helper
      run: dotnet pack source/SourceGeneration.PackageTesting/SourceGeneration.PackageTesting.csproj -c Release

    - name: Build PropertyCacheHelper.Shared
      run: dotnet pack source/SourceGenerators/PropertyCacheHelper/Shared/PropertyCacheHelper.Shared.csproj -c Release
    - name: Build PropertyCacheHelper.SourceGenerator
      run: dotnet pack source/SourceGenerators/PropertyCacheHelper/SourceGenerator/PropertyCacheHelper.SourceGenerator.csproj -c Release

    - name: Build AutoImplementedProperties.Shared
      run: dotnet pack source/SourceGenerators/AutoImplementedProperties/Shared/AutoImplementedProperties.Shared.csproj -c Release
    - name: Build AutoImplementedProperties.SourceGenerator
      run: dotnet pack source/SourceGenerators/AutoImplementedProperties/SourceGenerator/AutoImplementedProperties.SourceGenerator.csproj -c Release

    - name: Build AutoConstructor.Shared
      run: dotnet pack source/SourceGenerators/AutoConstructor/Shared/AutoConstructor.Shared.csproj -c Release
    - name: Build AutoConstructor.SourceGenerator
      run: dotnet pack source/SourceGenerators/AutoConstructor/SourceGenerator/AutoConstructor.SourceGenerator.csproj -c Release

    - name: Test
      run: dotnet test SourceGenerators.slnx -c Release
    - name: Test SDK package from local feed
      run: ./build/test-sdk-consumer.sh

    # Upload the packages to the pipeline artifacts
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget_packages
        path: artifacts/*.nupkg
        if-no-files-found: error

  # Publish the packages to NuGet.org
  publish-nuget:
    needs: [build-packages]
    runs-on: ubuntu-latest
    if: ${{github.event_name == 'push' && github.ref == 'refs/heads/master'}}
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nuget_packages
        path: artifacts
    - name: NuGet login (OIDC → temporary API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish packages to NuGet.org
      run: dotnet nuget push "artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
